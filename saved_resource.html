:root {
  --c-pink: #ff3d8b;
  --c-orange: #ff7847;
  --c-yellow: #ffd93d;
  --c-green: #4ade80;
  --c-cyan: #22d3ee;
  --c-purple: #a855f7;
  --c-indigo: #6366f1;
}

* {
  font-family: 'Outfit', system-ui, sans-serif;
}

body {
  margin: 0;
  background: #0f0a1e;
  color: #f8f4ff;
  min-height: 100vh;
}

.font-display {
  font-family: 'Space Grotesk', sans-serif;
}

.animated-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
}

@keyframes float-blob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.1); }
  66% { transform: translate(-30px, 20px) scale(0.95); }
}

.blob-1 {
  width: 400px;
  height: 400px;
  background: var(--c-pink);
  top: -100px;
  left: -100px;
  animation: float-blob 18s ease-in-out infinite;
}

.blob-2 {
  width: 350px;
  height: 350px;
  background: var(--c-cyan);
  top: 30%;
  right: -80px;
  animation: float-blob 22s ease-in-out infinite reverse;
}

.blob-3 {
  width: 300px;
  height: 300px;
  background: var(--c-purple);
  bottom: -60px;
  left: 30%;
  animation: float-blob 16s ease-in-out infinite;
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.gradient-text {
  background: linear-gradient(90deg, var(--c-pink), var(--c-orange), var(--c-yellow), var(--c-green), var(--c-cyan), var(--c-pink));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 6s linear infinite;
}

.card-glow {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  transition: all 0.3s ease;
}

.card-glow:hover {
  border-color: rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
}

.rainbow-btn {
  background: linear-gradient(135deg, var(--c-pink), var(--c-orange), var(--c-yellow));
  background-size: 200% auto;
  transition: all 0.3s ease;
  border: none;
}

.rainbow-btn:hover {
  background-position: right center;
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(255, 61, 139, 0.4);
}

.rainbow-btn:active {
  transform: translateY(0);
}

.rainbow-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.input-colorful {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  color: #f8f4ff;
  transition: all 0.25s ease;
  outline: none;
  padding: 12px 16px;
  width: 100%;
  font-size: 15px;
}

.input-colorful::placeholder {
  color: rgba(255, 255, 255, 0.35);
}

.input-colorful:focus {
  border-color: var(--c-cyan);
  background: rgba(34, 211, 238, 0.05);
  box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
}

.label-colorful {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 6px;
  display: block;
}

.tab-active {
  background: linear-gradient(135deg, var(--c-indigo), var(--c-purple));
  color: white;
}

@keyframes pulse-ring {
  0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
  70% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
  100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
}

.pulse-dot {
  animation: pulse-ring 2s infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.spinner {
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top-color: var(--c-cyan);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  animation: spin 0.8s linear infinite;
  display: inline-block;
